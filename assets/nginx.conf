user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  server_tokens off;

  upstream umami {
    server 127.0.0.1:3000;
  }

  # Only what a tracked site's visitors need; the dashboard stays on its own interface.
  server {
    listen 3001;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;

    location = /script.js { proxy_pass http://umami; }
    location = /recorder.js { proxy_pass http://umami; }
    location = /api/send { proxy_pass http://umami; }
    location = /api/record { proxy_pass http://umami; }
    location /p/ { proxy_pass http://umami; }
    location /q/ { proxy_pass http://umami; }

    location / {
      return 404;
    }
  }
}
